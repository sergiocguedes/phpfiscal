    "parameters": {
      "NfseRef": {
        "name": "ref",
        "in": "path",
        "required": true,
        "description": "Id da DPS (\"DPS\" + 42 dígitos) ou chave de acesso da NFS-e (50 dígitos)",
        "schema": {
          "type": "string",
          "pattern": "^(DPS\\d{42}|\\d{50})$"
        }
      },
      "IdempotencyKeyOptional": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_.:\\-]{8,128}$"
        }
      },
      "Chave": {
        "name": "chave",
        "in": "path",
        "required": true,
        "description": "Chave de acesso (44 dígitos, DV válido)",
        "schema": {
          "type": "string",
          "pattern": "^\\d{44}$"
        },
        "example": "35261011222333000181550010000000011031138987"
      }
    },
