        "description": "Monta, valida, assina e transmite NF-e/NFC-e a partir de dados completos. Idempotency-Key obrigatório na emissão real. Use dry_run=1 para validar sem transmitir. Não há catálogo, perfis de cálculo ou integrações comerciais nesta edição. O modo RTC informado preserva valores calculados no Delphi. Para operação durável do PDV com contingência e recuperação após timeout, utilize /api/v1/pdv/nfce.\n\nCódigos fiscais no JSON do ERP, em dois modos (calculo_tributos.modo): api — itens com regra (cfop, CST/CSOSN, alíquotas, cClassTrib), a API calcula os tributos no envio, antes de montar o XML, e o dry-run devolve o cálculo completo em calculo_tributos; erp — itens com impostos já calculados, as tags vão para o XML sem recálculo. Valor final informado na regra (ajuste manual) exige papel proprietário ou fiscal (403 ajuste_manual_negado). Se calculo_tributos.calculo_id não bater com o cálculo atual: 409 calculo_divergente, antes de numerar.",
        "parameters": [
          {
            "name": "dry_run",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "0",
                "1",
                "true",
                "false"
              ]
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "description": "**Obrigatório na emissão real** (sem `dry_run`); opcional no dry-run. 8 a 128 caracteres `[A-Za-z0-9_.:-]`.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_.:\\-]{8,128}$"
            },
            "example": "pedido-1001"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NfeInput"
              },
              "examples": {
                "simples_nacional": {
                  "$ref": "#/components/examples/NfeExemplo"
                },
                "nfce": {
                  "$ref": "#/components/examples/NfceExemplo"
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Dry-run — XML montado e válido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DryRunResult"
                }
              }
            }
          },
          "201": {
            "description": "NF-e autorizada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NfeRecord"
                }
              }
            }
          },
          "202": {
            "description": "Lote em processamento na SEFAZ (consulte depois)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NfeRecord"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "412": {
            "$ref": "#/components/responses/NoCertificate"
          },
          "422": {
            "description": "Payload inválido, dry-run com erro de schema, ou NF-e rejeitada/denegada pela SEFAZ",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Error"
                    },
                    {
                      "$ref": "#/components/schemas/NfeRecord"
                    },
                    {
                      "$ref": "#/components/schemas/DryRunResult"
                    }
                  ]
                }
              }
            }
          },
          "502": {
            "description": "Falha de comunicação com a SEFAZ (status \"erro\"; consulte antes de reenviar)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NfeRecord"
                }
              }
            }
          },
          "403": {
            "description": "Ajuste manual de valor calculado sem papel proprietário/fiscal (ajuste_manual_negado)"
          }
        }
      },
      "parameters": [
        {
          "in": "header",
          "name": "X-Empresa-Id",
          "required": false,
          "description": "Obrigatório para acesso central. Chaves da empresa não podem selecionar outra empresa.",
          "schema": {
            "type": "string",
            "pattern": "^t_[a-f0-9]{16}$"
          }
        }
      ]
    },
