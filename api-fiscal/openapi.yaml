    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-nfe_sessao",
        "description": "Sessão da interface web (HttpOnly, Secure, SameSite=Strict). Mutações exigem também csrfToken."
      },
      "csrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Token csrf_token de /auth/login ou /auth/sessao; exigido em mutações autenticadas por sessão."
      },
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "nfk_... para uma empresa ou adm_... para administração central. Chave administrativa exige X-Empresa-Id nas operações fiscais."
      },
      "hmacSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Signature",
        "description": "sha256=<hex> — HMAC-SHA256 do corpo bruto"
      },
      "portalSessao": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-portal_sessao",
        "description": "Sessão do Portal do Contador (em HTTP local o nome é portal_sessao). Escritas exigem X-CSRF-Token e o cabeçalho X-Portal: 1."
      }
    }
