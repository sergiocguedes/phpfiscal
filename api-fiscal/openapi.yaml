      "IbsCbs": {
        "type": "object",
        "description": "Reforma Tributária (NT 2025.002 v1.52). Obrigatório para regime normal (CRT 3) em homologação (UB12-10, rejeição\n1115); em produção, obrigatório por lei desde 03/08/2026 mas ainda sem rejeição (aviso); Simples Nacional: opcional\nem 2026. Base, alíquotas do ano (2026: IBS UF 0,1%, IBS Mun 0%, CBS 0,9%), redução da tabela oficial, diferimento e\nvalores são calculados; valores informados são conferidos (tolerância 0,01). Veja docs/REFORMA-TRIBUTARIA.md.",
        "required": [
          "CST",
          "cClassTrib"
        ],
        "properties": {
          "CST": {
            "type": "string",
            "enum": [
              "000",
              "200",
              "400",
              "410",
              "510",
              "515"
            ]
          },
          "cClassTrib": {
            "type": "string",
            "pattern": "^\\d{6}$"
          },
          "vBC": {
            "type": "number",
            "minimum": 0,
            "description": "Padrão: item + frete + seguro + outras − desconto − ICMS − FCP − PIS − COFINS"
          },
          "pDif": {
            "type": "number",
            "description": "Obrigatório nos CST 510/515"
          },
          "indDoacao": {
            "type": "boolean"
          },
          "pIBSUF": {
            "type": "number"
          },
          "pIBSMun": {
            "type": "number"
          },
          "pCBS": {
            "type": "number"
          },
          "pRedIBS": {
            "type": "number",
            "description": "Deve ser igual ao da tabela oficial"
          },
          "pRedCBS": {
            "type": "number",
            "description": "Deve ser igual ao da tabela oficial"
          },
          "vIBSUF": {
            "type": "number"
          },
          "vIBSMun": {
            "type": "number"
          },
          "vCBS": {
            "type": "number"
          }
        },
        "example": {
          "CST": "000",
          "cClassTrib": "000001"
        }
      },
