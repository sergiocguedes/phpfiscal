{
  "openapi": "3.1.0",
  "info": {
    "title": "API Fiscal — NF-e, NFC-e e NFS-e",
    "version": "3.2.0-api",
    "description": "API fiscal central. Ambientes independentes por empresa: ambiente_nfe, ambiente_nfce e ambiente_nfse (1 produção, 2 homologação), sem trava global ALLOW_PRODUCAO. Responsável técnico e configuração do sistema ficam no painel administrativo. NFS-e recebe o serviço completo no JSON; não há catálogo de serviços. RTC recebe CST/cClassTrib, valores e totais no modo informado, sem tabelas tributárias locais nem cálculo de IBS/CBS. Mantida validação estrutural XSD. Credenciais centrais usam X-Empresa-Id."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "tags": [
    {
      "name": "Sistema"
    },
    {
      "name": "Autenticação"
    },
    {
      "name": "Tenant"
    },
    {
      "name": "Configuração"
    },
    {
      "name": "Certificado"
    },
    {
      "name": "SEFAZ"
    },
    {
      "name": "NF-e"
    },
    {
      "name": "NFS-e"
    },
    {
      "name": "Tributos",
      "description": "Cálculo de ICMS, IPI, PIS, COFINS, ISSQN e tributos aproximados. Ver docs/TRIBUTOS-CALCULO.md."
    },
    {
      "name": "Portal do Contador",
      "description": "Acesso sem senha pelo atalho dos sistemas. Ver docs/PORTAL-CONTADOR.md."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    },
    {
      "cookieAuth": []
    }
  ],
  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "health",
        "tags": [
          "Sistema"
        ],
        "summary": "Verificação de saúde",
        "security": [],
        "responses": {
          "200": {
            "description": "Serviço no ar",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "example": "ok"
                    },
                    "versao": {
                      "type": "string",
                      "example": "1.0.0"
                    },
                    "hora": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/docs": {
      "get": {
        "operationId": "swaggerUi",
        "tags": [
          "Sistema"
        ],
        "summary": "Swagger UI",
        "security": [],
        "responses": {
          "200": {
            "description": "HTML",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/openapi.yaml": {
      "get": {
        "operationId": "openapiSpec",
        "tags": [
          "Sistema"
        ],
        "summary": "Esta especificação",
        "security": [],
        "responses": {
          "200": {
            "description": "YAML",
            "content": {
              "application/yaml": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "operationId": "login",
        "tags": [
          "Autenticação"
        ],
        "summary": "Login por e-mail e senha",
        "description": "Resposta genérica para e-mail inexistente ou senha errada. Após 5 falhas em 15 min a conta (o e-mail, exista ou não)\nfica bloqueada (429 `conta_bloqueada`). Também há limite de 20 falhas por IP em 15 min.\n\n**MFA:** se o usuário tiver a verificação em duas etapas ativa, a senha correta NÃO abre sessão: a resposta é\n`{\"mfa_necessario\": true, \"mfa_token\": \"...\", \"expira_em\": \"...\"}` (sem cookie) e o login termina em\n`POST /auth/mfa/verificar`. Falhas no segundo fator contam no mesmo bloqueio da conta.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "senha"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email"
                  },
                  "senha": {
                    "type": "string",
                    "format": "password"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Sessão aberta (sem MFA) ou segunda etapa pendente (com MFA)",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "Só quando a sessão é aberta (sem MFA)"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Sessao"
                    },
                    {
                      "$ref": "#/components/schemas/MfaDesafio"
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "description": "E-mail ou senha inválidos",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origem não permitida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/esqueci-senha": {
      "post": {
        "operationId": "forgotPassword",
        "tags": [
          "Autenticação"
        ],
        "summary": "Solicita link de redefinição de senha",
        "description": "Sempre responde 202, exista ou não o e-mail. O link (`/redefinir-senha#token=...`) vale 30 min, é de uso único e\nsó o hash do token fica no servidor. Sem SMTP configurado (modo dev), o link é gravado em `storage/logs/mail.log`.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Pedido aceito (resposta idêntica para qualquer e-mail)"
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/redefinir-senha": {
      "post": {
        "operationId": "resetPassword",
        "tags": [
          "Autenticação"
        ],
        "summary": "Define nova senha usando o token do e-mail",
        "description": "Consome o token (uso único) e encerra todas as sessões abertas do usuário.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "token",
                  "senha"
                ],
                "properties": {
                  "token": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_-]{43}$"
                  },
                  "senha": {
                    "type": "string",
                    "format": "password"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Senha redefinida"
          },
          "400": {
            "0": "usado ou expirado (`token_invalido`)",
            "description": "Token inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          }
        }
      }
    },
    "/api/v1/auth/mfa/verificar": {
      "post": {
        "operationId": "mfaVerify",
        "tags": [
          "Autenticação"
        ],
        "summary": "Segunda etapa do login (código TOTP ou de recuperação)",
        "description": "`mfa_token` vem de `/auth/login` (vale 5 min, uso único, até 5 tentativas). `codigo`: 6 dígitos do aplicativo\nautenticador (janela de ±30 s; um código já usado não vale de novo) ou um código de recuperação `XXXXX-XXXXX`\n(uso único). Falhas contam no bloqueio da conta (`LOGIN_MAX_FAILURES` em `LOGIN_LOCK_SECONDS`) e no limite por IP.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "mfa_token",
                  "codigo"
                ],
                "properties": {
                  "mfa_token": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_-]{43}$"
                  },
                  "codigo": {
                    "type": "string",
                    "example": "123456"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Sessão aberta",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Sessao"
                }
              }
            }
          },
          "401": {
            "description": "`codigo_invalido` (tente de novo) ou `mfa_etapa_invalida` (entre novamente com a senha)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origem não permitida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/sessao": {
      "get": {
        "operationId": "me",
        "tags": [
          "Autenticação"
        ],
        "summary": "Dados da sessão atual (usuário, tenant, csrf_token) ou da chave de API",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Sessao"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "tags": [
          "Autenticação"
        ],
        "summary": "Encerra a sessão (invalida no servidor)",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "responses": {
          "204": {
            "description": "Sessão encerrada; cookie apagado"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/api/v1/auth/mfa": {
      "get": {
        "operationId": "mfaStatus",
        "tags": [
          "Autenticação"
        ],
        "summary": "Situação do MFA do usuário logado (somente sessão)",
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ativo": {
                      "type": "boolean"
                    },
                    "ativado_em": {
                      "type": [
                        "string",
                        "null"
                      ],
                      "format": "date-time"
                    },
                    "codigos_recuperacao_restantes": {
                      "type": "integer"
                    },
                    "obrigatorio": {
                      "type": "boolean",
                      "description": "MFA_OBRIGATORIO_DONO=true e o usuário é owner"
                    },
                    "cadastro_pendente": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/mfa/iniciar": {
      "post": {
        "operationId": "mfaStart",
        "tags": [
          "Autenticação"
        ],
        "summary": "Inicia o cadastro do MFA (gera segredo TOTP; somente sessão)",
        "description": "Gera um segredo de 160 bits (guardado cifrado) e devolve a URI `otpauth://` (emissor \"Emissor NF-e\", conta = e-mail)\ne o segredo em Base32 para digitação manual. O cadastro expira em 10 min. Recusado (409 `mfa_ja_ativo`) se o MFA já\nestiver ativo: depois de confirmado, o segredo nunca mais é devolvido.",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "responses": {
          "201": {
            "description": "Cadastro iniciado",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "otpauth_uri": {
                      "type": "string",
                      "example": "otpauth://totp/Emissor%20NF-e:voce%40empresa.com.br?secret=...&issuer=Emissor%20NF-e&algorithm=SHA1&digits=6&period=30"
                    },
                    "segredo": {
                      "type": "string",
                      "description": "Base32 (32 caracteres)"
                    },
                    "segredo_agrupado": {
                      "type": "string",
                      "example": "ABCD EFGH IJKL MNOP QRST UVWX YZ23 4567"
                    },
                    "emissor": {
                      "type": "string"
                    },
                    "conta": {
                      "type": "string"
                    },
                    "algoritmo": {
                      "type": "string",
                      "example": "SHA1"
                    },
                    "digitos": {
                      "type": "integer",
                      "example": 6
                    },
                    "periodo": {
                      "type": "integer",
                      "example": 30
                    },
                    "expira_em": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          },
          "409": {
            "description": "MFA já ativo",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/mfa/confirmar": {
      "post": {
        "operationId": "mfaConfirm",
        "tags": [
          "Autenticação"
        ],
        "summary": "Confirma o cadastro com um código do aplicativo e ativa o MFA",
        "description": "Devolve 8 códigos de recuperação de uso único — exibidos **somente nesta resposta** (no servidor fica só o HMAC).\nEncerra as outras sessões do usuário e devolve um novo cookie e `csrf_token`.",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "codigo"
                ],
                "properties": {
                  "codigo": {
                    "type": "string",
                    "pattern": "^\\d{6}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "MFA ativado",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ativo": {
                      "type": "boolean"
                    },
                    "codigos_recuperacao": {
                      "type": "array",
                      "items": {
                        "type": "string",
                        "example": "ABCDE-FGH23"
                      },
                      "minItems": 8,
                      "maxItems": 8
                    },
                    "csrf_token": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "409": {
            "description": "MFA já ativo ou cadastro não iniciado/expirado (`mfa_cadastro_expirado`)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/mfa/desativar": {
      "post": {
        "operationId": "mfaDisable",
        "tags": [
          "Autenticação"
        ],
        "summary": "Desativa o MFA (exige senha atual + código TOTP ou de recuperação)",
        "description": "Encerra as outras sessões e devolve novo cookie. Com `MFA_OBRIGATORIO_DONO=true`, proprietários recebem 409 `mfa_obrigatorio`.",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "senha",
                  "codigo"
                ],
                "properties": {
                  "senha": {
                    "type": "string",
                    "format": "password"
                  },
                  "codigo": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "MFA desativado; novo cookie e novo csrf_token"
          },
          "409": {
            "description": "MFA inativo ou obrigatório",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/mfa/codigos-recuperacao": {
      "post": {
        "operationId": "mfaRecoveryCodes",
        "tags": [
          "Autenticação"
        ],
        "summary": "Gera novos códigos de recuperação (exige senha atual + código); os anteriores deixam de valer",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "senha",
                  "codigo"
                ],
                "properties": {
                  "senha": {
                    "type": "string",
                    "format": "password"
                  },
                  "codigo": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Novos códigos (exibidos uma única vez)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "codigos_recuperacao": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            }
          },
          "409": {
            "description": "MFA inativo",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          },
          "429": {
            "$ref": "#/components/responses/TooMany"
          }
        }
      }
    },
    "/api/v1/auth/perfil": {
      "put": {
        "operationId": "updateProfile",
        "tags": [
          "Autenticação"
        ],
        "summary": "Altera o nome do usuário logado (somente sessão)",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "nome"
                ],
                "properties": {
                  "nome": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Usuario"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/alterar-senha": {
      "post": {
        "operationId": "changePassword",
        "tags": [
          "Autenticação"
        ],
        "summary": "Troca a senha (exige a atual); encerra as outras sessões e devolve nova sessão",
        "security": [
          "{ cookieAuth: []",
          {
            "csrfToken": "[] }"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "senha_atual",
                  "nova_senha"
                ],
                "properties": {
                  "senha_atual": {
                    "type": "string",
                    "format": "password"
                  },
                  "nova_senha": {
                    "type": "string",
                    "format": "password"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Senha alterada; novo cookie e novo csrf_token"
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          }
        }
      }
    },
    "/api/v1/tenant": {
      "get": {
        "x-interno": true,
        "operationId": "getTenant",
        "tags": [
          "Tenant"
        ],
        "summary": "Dados da empresa (tenant) autenticada",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Tenant"
                }
              }
            }
          }
        }
      },
      "put": {
        "x-interno": true,
        "operationId": "renameTenant",
        "tags": [
          "Tenant"
        ],
        "summary": "Renomeia a empresa (owner)",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "nome"
                ],
                "properties": {
                  "nome": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Tenant"
                }
              }
            }
          },
          "403": {
            "description": "Requer papel owner"
          }
        }
      },
      "parameters": [
