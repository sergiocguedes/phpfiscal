    "/api/v1/pdv/nfce": {
      "post": {
        "operationId": "emitirNfcePdv",
        "tags": [
          "NF-e"
        ],
        "summary": "Emite NFC-e do PDV e retorna XML autorizado ou de contingência",
        "description": "Contrato dedicado ao PDV local. A nota informa impostos calculados pelo Delphi.\nA API reserva a numeração, monta, assina e transmite. operacao_id é obrigatório e durável:\nrepetição idêntica retorna o estado atual sem transmitir novamente; outro conteúdo retorna 409.\nNão depende de Idempotency-Key. Não informar nota.numero.\nEm timeout após envio, mantém a mesma identidade e exige consulta antes da retransmissão.\nEm contingência offline devolve NFe assinada ainda sem protocolo; na autorização devolve nfeProc.\nDetalhes e responsabilidades em docs/PDV-NFCE.md.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "operacao_id",
                  "nota"
                ],
                "properties": {
                  "operacao_id": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                    "example": "loja01-caixa01-venda12345"
                  },
                  "contingencia": {
                    "type": "string",
                    "enum": [
                      "automatica",
                      "offline",
                      "desativada"
                    ],
                    "default": "automatica"
                  },
                  "motivo_contingencia": {
                    "type": "string",
                    "minLength": 15,
                    "maxLength": 256
                  },
                  "nota": {
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/NfeInput"
                      },
                      {
                        "type": "object",
                        "properties": {
                          "modelo": {
                            "type": "integer",
                            "enum": [
                              65
                            ]
                          }
                        },
                        "description": "Por item, impostos (ICMS, PIS e COFINS calculados pelo PDV) ou regra (a API calcula); numero não é aceito."
                      }
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Replay de operação cancelada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PdvNfceRecord"
                }
              }
            }
          },
          "201": {
            "description": "Autorizada; xml contém nfeProc com protocolo",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PdvNfceRecord"
                }
              }
            }
          },
          "202": {
            "description": "Contingência pendente, preparação ou situação incerta; consultar operacao_id",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PdvNfceRecord"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "description": "Produção bloqueada ou acesso proibido"
          },
          "409": {
            "description": "Operação com conteúdo divergente, numeração utilizada ou contingência de produção não habilitada"
          },
          "412": {
            "description": "Certificado A1 ausente ou expirado"
          },
          "422": {
            "description": "Validação antes da emissão (envelope erro) ou rejeição/denegação fiscal (PdvNfceRecord)"
          },
          "502": {
            "description": "Status da SEFAZ inesperado antes da criação da operação"
          }
        }
      },
      "parameters": [
        {
          "in": "header",
          "name": "X-Empresa-Id",
          "required": false,
          "description": "Obrigatório para acesso central. Chaves da empresa não podem selecionar outra empresa.",
          "schema": {
