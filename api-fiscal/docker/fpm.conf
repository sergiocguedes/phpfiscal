[www]
user = emissor
group = emissor
listen = 9000
clear_env = no
catch_workers_output = yes
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_terminate_timeout = 150s
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
