; Emissor NF-e 2.9.1 · endurecimento do PHP (CVE-2026-109618 / CVE-2026-109619)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; envios multipart não são interpretados pelo PHP (o painel e a API usam JSON/base64)
enable_post_data_reading = Off
session.upload_progress.enabled = Off
post_max_size = 3M
upload_max_filesize = 1M
max_file_uploads = 1
max_input_vars = 1000
max_input_nesting_level = 16
allow_url_include = Off
